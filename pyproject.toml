[project]
name = "ai-memory"
version = "0.8.2"
description = "Human-brain-inspired local-first AI memory, MCP-pluggable"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastmcp>=2.0.0",
  "sentence-transformers>=6.1.0",
  "sqlite-vec>=0.1.0",
]

[project.scripts]
ai-memory-mcp = "ai_memory.server:main"
ai-memory-consolidate = "ai_memory.worker:main"
ai-memory = "ai_memory.cli:main"
ai-memory-serve = "ai_memory.server:serve_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
